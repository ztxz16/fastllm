<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen-Image · FastLLM</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202c29;background:#f4f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{padding:25px 5vw;border-bottom:1px solid #dde3dc;display:flex;justify-content:space-between;align-items:center;background:#fafbf7}.brand{font-weight:700;letter-spacing:-.6px;font-size:21px}.brand span{font-weight:400;color:#6d7972;font-size:14px;letter-spacing:0;margin-left:12px}.status{font-size:12px;border:1px solid #d1ded2;border-radius:20px;padding:7px 12px;color:#47684d}main{max-width:1420px;margin:38px auto;padding:0 5vw;display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:32px}h1{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:0 0 12px}p{color:#6c7971;font-size:14px;line-height:1.7;margin:0 0 25px}.panel{background:white;border:1px solid #dde3dc;border-radius:18px;padding:24px}label{display:block;font-size:13px;font-weight:600;margin:0 0 9px}textarea,input,select{font:inherit;font-size:14px;color:inherit;width:100%;border:1px solid #d9e0d8;border-radius:9px;padding:12px;background:#fafbf9;outline:none}textarea{min-height:158px;resize:vertical;line-height:1.7}textarea:focus,input:focus,select:focus{border-color:#45765e;box-shadow:0 0 0 3px #45765e12}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}details{margin:22px 0}summary{font-size:13px;color:#65756a;cursor:pointer}details .row{margin-top:14px}.actions{display:flex;gap:9px;margin-top:24px}button{font:inherit;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;background:#e7ede5;color:#294431;font-size:14px;font-weight:600}.primary{background:#285a43;color:white;flex:1}button:disabled{opacity:.5;cursor:wait}.secondary{font-size:12px;padding:9px 13px}.preview{min-height:490px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:18px;overflow:hidden;background-color:#e9eee7;background-image:linear-gradient(45deg,#e1e7de 25%,transparent 25%),linear-gradient(-45deg,#e1e7de 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e1e7de 75%),linear-gradient(-45deg,transparent 75%,#e1e7de 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}#result{display:none;width:100%;max-height:76vh;object-fit:contain}.empty{text-align:center;padding:35px;color:#748271}.empty svg{width:42px;height:42px;margin-bottom:18px;stroke:#647c65}.empty strong{display:block;font-weight:500;font-size:17px}.empty small{display:block;font-size:13px;margin-top:9px}.footer{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px;min-height:55px}#message{font-size:13px;color:#566a5a;line-height:1.5}#download{display:none;color:#285a43;font-size:13px;text-decoration:none;font-weight:600;white-space:nowrap}.bar{height:4px;background:#dce7d9;border-radius:8px;overflow:hidden;margin-top:14px;display:none}.bar div{height:100%;width:0;background:#285a43;transition:width .3s}#error{color:#a43732;font-size:13px;line-height:1.5;margin-top:15px;white-space:pre-wrap}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;background:#eef2eb;padding:14px;border-radius:9px;margin-bottom:0}a{color:#285a43}.note{font-size:12px;color:#859081;margin-top:18px;line-height:1.6}@media(max-width:800px){main{grid-template-columns:1fr;padding:0 18px;margin-top:24px;gap:22px}header{padding:20px}.preview{min-height:350px}.brand span{display:none}}
</style>
<header><div class="brand">Qwen-Image <span>2.1 · FastLLM</span></div><div class="status" id="health">连接服务中</div></header>
<main><section><h1>把想法变成图像。</h1><p>描述主体、场景与风格，生成属于你的图片。</p><div class="panel">
<label for="prompt">画面描述</label><textarea id="prompt">一只橘猫坐在窗边的木桌上，清晨的柔和阳光，真实摄影风格，细腻的毛发。</textarea>
<div style="margin-top:20px"><label for="images">参考图片（可选，最多 10 张）</label><input id="images" type="file" accept="image/*" multiple><small id="image-note" style="display:block;color:#6c7971;margin-top:8px">添加参考图后可描述希望如何修改。</small></div>
<div class="row"><div><label for="size">图片尺寸</label><select id="size"><option>512x512</option><option selected>1024x1024</option><option>1344x768</option><option>768x1344</option><option>2048x2048</option></select></div><div><label for="seed">随机种子</label><input id="seed" type="number" min="0" max="2147483647" placeholder="随机"></div></div>
<details><summary>更多设置</summary><div class="row"><div><label for="steps">采样步数</label><input id="steps" type="number" min="2" max="100" value="40"></div><div><label for="reference">参考图分辨率</label><select id="reference"><option>256</option><option>512</option><option selected>1024</option></select></div></div><div class="row"><div><label for="key">API Key（可选）</label><input id="key" type="password" autocomplete="off" placeholder="本地服务密钥"></div></div></details>
<div class="actions"><button class="primary" id="generate">生成图片</button><button id="cancel" hidden>取消</button></div><div class="bar" id="bar"><div id="fill"></div></div><div id="error" role="alert"></div>
</div><div class="note">图片保存在服务端。透明区域以棋盘格展示，下载格式为 PNG。</div>
<details><summary>用 API 调用同一个请求</summary><p style="margin-top:12px"><a href="/openapi.json" target="_blank" rel="noopener">OpenAPI 接口定义</a> · 参考图调用请先转为 PNG。</p><div class="actions"><button class="secondary" id="copy">复制 curl</button></div><pre id="curl"></pre></details>
</section><section><div class="preview"><div class="empty" id="empty"><svg viewBox="0 0 48 48" fill="none" stroke-width="1.5"><rect x="7" y="7" width="34" height="34" rx="6"/><circle cx="18" cy="18" r="3"/><path d="m8 34 10-10 8 8 6-6 9 9"/></svg><strong>你的下一幅作品，从一句话开始</strong><small>生成后的图片将在这里显示</small></div><img id="result" alt="生成的图片"></div><div class="footer"><span id="message">准备就绪后即可生成</span><a id="download" download="qwen-image.png">下载 PNG ↓</a></div></section></main>
<script>
const $=id=>document.getElementById(id);let active=null,blobURL=null;
function body(){const v={model:'qwen-image-2.1',prompt:$('prompt').value,size:$('size').value,num_inference_steps:Number($('steps').value)};if($('seed').value!=='')v.seed=Number($('seed').value);return v}
function headers(json=true){const h=json?{'Content-Type':'application/json'}:{};if($('key').value)h.Authorization='Bearer '+$('key').value;return h}
async function api(path,options={}){const r=await fetch(path,{...options,headers:headers(!(options.body instanceof FormData))});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||j.error||'请求失败');return j}
function shell(value){return "'"+value.replace(/'/g,"'\\''")+"'"}
function curl(){
 const auth=$('key').value?' -H "Authorization: Bearer $FASTLLM_API_KEY"':'';
 if($('images').files.length){
  const fields={...body(),reference_resolution:Number($('reference').value),response_format:'url'};
  $('curl').textContent=`curl ${location.origin}/v1/images/edits${auth} `+Object.entries(fields).map(([k,v])=>'--form-string '+shell(k+'='+v)).join(' ')+Array.from($('images').files).map((f,i)=>' -F '+shell('image[]=@reference-'+(i+1)+'.png')).join('');
 }else{
  const text=JSON.stringify({...body(),response_format:'url'},null,2);
  $('curl').textContent=`curl ${location.origin}/v1/images/generations${auth} -H 'Content-Type: application/json' --data-binary @- <<'JSON'\n${text}\nJSON`;
 }
}
for(const id of ['prompt','size','steps','seed','images','reference','key'])$(id).addEventListener('input',curl);curl();
async function requestBody(){
 const files=Array.from($('images').files); if(!files.length)return JSON.stringify(body());
 if(files.length>10)throw new Error('最多选择 10 张参考图');
 const form=new FormData();for(const [k,v]of Object.entries({...body(),reference_resolution:Number($('reference').value)}))form.append(k,String(v));
 for(const file of files){
  const bitmap=await createImageBitmap(file);if(bitmap.width*bitmap.height>16777216){bitmap.close();throw new Error('参考图不能超过 1600 万像素')}
  const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);bitmap.close();
  const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw new Error('无法读取参考图');form.append('image[]',png,'reference.png');
 }
 return form;
}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('curl').textContent);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制 curl',1500)}catch(e){$('error').textContent='请选中下方命令复制。'}};
async function poll(job){while(active===job.id){const j=await api('/v1/images/jobs/'+job.id);if(j.status==='completed'){const r=await fetch(j.url,{headers:headers()});if(!r.ok)throw new Error('图片下载失败');if(blobURL)URL.revokeObjectURL(blobURL);blobURL=URL.createObjectURL(await r.blob());$('result').src=blobURL;$('result').style.display='block';$('empty').style.display='none';$('download').href=blobURL;$('download').style.display='block';$('message').textContent='生成完成 · Seed '+j.seed;$('seed').value=j.seed;curl();return}if(j.status==='failed'||j.status==='cancelled')throw new Error(j.status==='cancelled'?'任务已取消':j.error||'生成失败');const stages={queued:'排队中',encoding:'理解描述和参考图',encoding_image:'处理参考图',denoising:'正在生成',decoding:'处理图片',completed:'完成'};$('message').textContent=(stages[j.stage]||j.stage)+(j.stage==='denoising'?` · ${j.step}/${j.total_steps}`:'');$('fill').style.width=(j.stage==='denoising'?10+80*j.step/j.total_steps:j.stage==='decoding'?95:5)+'%';await new Promise(r=>setTimeout(r,1000))}}
$('generate').onclick=async()=>{$('error').textContent='';$('generate').disabled=true;$('cancel').hidden=false;$('bar').style.display='block';try{const j=await api('/v1/images/jobs',{method:'POST',body:await requestBody()});active=j.id;await poll(j)}catch(e){$('error').textContent=e.message;$('message').textContent=''}finally{active=null;$('generate').disabled=false;$('cancel').hidden=true;$('bar').style.display='none'}};
$('cancel').onclick=async()=>{if(active)try{await api('/v1/images/jobs/'+active+'/cancel',{method:'POST',body:'{}'})}catch(e){$('error').textContent=e.message}};
async function health(){try{const r=await fetch('/health');const j=await r.json();$('health').textContent=j.status==='ready'?'本地服务已连接':j.status==='failed'?'模型加载失败':'模型准备中';if(j.status==='failed')$('error').textContent=j.error;if(j.status==='loading')setTimeout(health,2000)}catch(e){$('health').textContent='服务未连接';setTimeout(health,3000)}}health();
</script></html>
