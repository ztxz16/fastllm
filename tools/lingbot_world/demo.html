<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingBot World · FastLLM</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#131d29;--line:#27374a;--muted:#9bb0c7;--accent:#75d9bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#ecf2f9;font:15px/1.5 system-ui,sans-serif}main{max-width:1220px;margin:34px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:26px;margin:0;font-weight:650}header small{color:var(--muted)}.layout{display:grid;grid-template-columns:310px 1fr;gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.panel h2{font-size:17px;margin:0 0 18px}label{display:block;color:var(--muted);margin:16px 0 6px}input,textarea,select,button{font:inherit;color:inherit}textarea,input,select{width:100%;background:#0d1520;border:1px solid var(--line);border-radius:8px;padding:10px}textarea{resize:vertical;min-height:130px}input[type=file]{padding:8px;font-size:12px}button{border:1px solid #3a4d65;border-radius:9px;padding:10px 15px;background:#1c2b3e;cursor:pointer;transition:background .15s}button:hover:enabled{background:#2b425b}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);color:#0b2b24;border:0;font-weight:650;width:100%;margin-top:20px}.primary:hover:enabled{background:#a0ecd7}.viewport{background:#050a11;border-radius:12px;overflow:hidden;min-height:360px;display:flex;align-items:center;justify-content:center;position:relative}canvas{display:none;width:100%;height:auto}.placeholder{text-align:center;color:var(--muted);padding:40px}.placeholder strong{display:block;font-size:20px;font-weight:500;margin-bottom:12px}.status{display:flex;align-items:center;gap:10px;min-height:46px;margin:12px 0;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.busy .dot{animation:pulse 1s infinite}.error{color:#ffb3b3}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px}.controls h3{font-size:14px;font-weight:500;color:var(--muted);margin:0 0 10px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.foot{font-size:12px;color:#7b91aa;margin-top:17px}details{margin-top:16px;color:var(--muted)}summary{cursor:pointer}.scene-edit{margin-top:18px}.scene-edit textarea{min-height:76px}.scene-edit button{margin-top:8px}.badge{font-size:12px;border:1px solid var(--line);padding:5px 10px;border-radius:20px;color:var(--muted)}@keyframes pulse{50%{opacity:.25}}@media(max-width:900px){.layout{grid-template-columns:1fr}.viewport{min-height:240px}header{align-items:start}.controls{gap:10px}main{padding:0 14px;margin-top:20px}}
@media(max-width:520px){.controls{grid-template-columns:1fr}.controls button{white-space:nowrap}}
</style>
<main><header><div><h1>LingBot World</h1><small>从一张图片开始，探索连续的世界</small></div><span class="badge">FastLLM</span></header>
<div class="layout"><section class="panel"><h2>创建场景</h2><label for="image">起始图片</label><input id="image" type="file" accept="image/*"><label for="prompt">场景描述</label><textarea id="prompt" placeholder="描述场景的环境、光线与氛围"></textarea><label for="size">画面尺寸</label><select id="size"><option value="576,320">576 × 320</option><option value="832,480">832 × 480</option><option value="320,576">320 × 576</option></select><label for="seed">随机种子</label><input id="seed" type="number" value="42" min="0" max="2147483647"><button class="primary" id="create">创建并进入</button><details><summary>连接设置</summary><label for="apiKey">API 密钥</label><input id="apiKey" type="password" autocomplete="off" placeholder="服务未设置密钥时留空"></details><p class="foot">移动和转向会根据当前场景生成后续画面。</p></section>
<section class="panel"><div class="viewport"><canvas id="canvas"></canvas><div class="placeholder" id="placeholder"><strong>你的下一段旅程</strong>选择起始图片，创建一个可以探索的场景。</div></div><div class="status" id="status"><span class="dot"></span><span id="statusText">准备就绪</span></div>
<div class="controls"><div><h3>移动 · W / A / S / D</h3><div class="pad"><span></span><button data-action="forward">前进</button><span></span><button data-action="left">左移</button><button data-action="backward">后退</button><button data-action="right">右移</button></div><div class="row"><button data-action="up">上移 Q</button><button data-action="down">下移 E</button></div></div><div><h3>视角 · 方向键</h3><div class="pad"><span></span><button data-action="look_up">抬头</button><span></span><button data-action="look_left">左转</button><button data-action="look_down">低头</button><button data-action="look_right">右转</button></div><div class="row"><button data-action="stay">继续观察</button><button id="replay">重播</button></div></div></div>
<details class="scene-edit"><summary>修改场景描述</summary><textarea id="editPrompt" placeholder="输入更新后的完整场景描述"></textarea><button id="edit">应用描述</button></details>
</section></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let worldId=new URL(location.href).searchParams.get('world'),busy=false,png=null,clip=[],animation=0,lastResult=null;
const actionButtons=[...document.querySelectorAll('[data-action]')];
function status(text,error=false){$('statusText').textContent=text;$('status').classList.toggle('error',error)}
function lock(value){busy=value;$('status').classList.toggle('busy',value);$('create').disabled=value;actionButtons.forEach(b=>b.disabled=value||!worldId);$('edit').disabled=value||!worldId;$('replay').disabled=value||!clip.length}
async function api(path,body,method){const headers={};if($('apiKey').value)headers.Authorization='Bearer '+$('apiKey').value;if(body!==undefined)headers['Content-Type']='application/json';const response=await fetch(path,{method:method||(body!==undefined?'POST':'GET'),headers,body:body===undefined?undefined:JSON.stringify(body)});let data=await response.json();if(!response.ok){const error=Error(data.error?.message||response.statusText);error.status=response.status;throw error}return data}
function draw(image){canvas.width=image.width;canvas.height=image.height;canvas.style.display='block';$('placeholder').style.display='none';ctx.drawImage(image,0,0)}
function play(){cancelAnimationFrame(animation);if(!clip.length)return;let begin=performance.now();const fps=lastResult?.fps||16;function tick(t){let index=Math.max(0,Math.min(clip.length-1,Math.floor((t-begin)*fps/1000)));draw(clip[index]);if(index<clip.length-1)animation=requestAnimationFrame(tick)}animation=requestAnimationFrame(tick)}
async function show(result,animate=true){const headers=$('apiKey').value?{Authorization:'Bearer '+$('apiKey').value}:{};const next=await Promise.all(result.frames.map(async url=>{const r=await fetch(url,{headers});if(!r.ok)throw Error('画面加载失败');return createImageBitmap(await r.blob())}));cancelAnimationFrame(animation);clip.forEach(x=>x.close());clip=next;lastResult=result;if(animate)play();else draw(clip.at(-1))}
async function wait(job){const names={queued:'等待生成',text:'理解场景描述',image:'准备场景',denoise:'生成后续画面',history:'更新场景',decode:'呈现画面'};while(job.status!=='completed'){if(job.status==='failed'){if(job.world_deleted&&job.world_id===worldId){worldId=null;history.replaceState(null,'','/')}throw Error((job.error||'生成失败')+(job.world_deleted?'；请重新创建场景':''))}status(names[job.stage]||'生成中');await new Promise(r=>setTimeout(r,500));job=await api('/v1/jobs/'+job.id)}return job.result}
async function run(fn){if(busy)return;lock(true);try{await fn();status('可以继续探索')}catch(e){status(e.message,true)}finally{lock(false)}}
$('image').onchange=async()=>{const file=$('image').files[0];if(!file)return;try{const image=await createImageBitmap(file),c=document.createElement('canvas');c.width=image.width;c.height=image.height;c.getContext('2d').drawImage(image,0,0);png=c.toDataURL('image/png');if(!worldId)draw(image);image.close();status('图片已准备好')}catch(e){status('无法读取这张图片',true)}};
$('create').onclick=()=>run(async()=>{if(!png)throw Error('请先选择起始图片');const [width,height]=$('size').value.split(',').map(Number);if(worldId){await wait(await api('/v1/worlds/'+worldId,undefined,'DELETE'));worldId=null;history.replaceState(null,'','/')}const result=await wait(await api('/v1/worlds',{image:png,prompt:$('prompt').value,width,height,seed:Number($('seed').value)}));worldId=result.world_id;history.replaceState(null,'','?world='+worldId);$('editPrompt').value=$('prompt').value;await show(result)});
function move(action,prompt){return run(async()=>{if(!worldId)throw Error('请先创建场景');const body={action};if(prompt!==undefined)body.prompt=prompt;await show(await wait(await api('/v1/worlds/'+worldId+'/actions',body)))})}
actionButtons.forEach(b=>b.onclick=()=>move(b.dataset.action));$('replay').onclick=play;$('edit').onclick=()=>move('stay',$('editPrompt').value);
document.addEventListener('keydown',event=>{if(event.repeat||event.ctrlKey||event.metaKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;const action={w:'forward',s:'backward',a:'left',d:'right',q:'up',e:'down',ArrowLeft:'look_left',ArrowRight:'look_right',ArrowUp:'look_up',ArrowDown:'look_down'}[event.key];if(action){event.preventDefault();if(worldId&&!busy)move(action)}});
lock(false);if(worldId)run(async()=>{let world;try{world=await api('/v1/worlds/'+worldId)}catch(e){if(e.status===404){worldId=null;history.replaceState(null,'','/');throw Error('这个场景已释放，请重新创建')}throw e}$('prompt').value=$('editPrompt').value=world.prompt;if(world.last_result)await show(world.last_result,false)});
</script></html>
