<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>FastLLM Launcher</title>
    <link rel="icon" type="image/png" href="/assets/launcher-icon.png">
    <link rel="apple-touch-icon" href="/assets/launcher-icon.png">
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="/ui_plugins/harness/styles.css">
    <link rel="stylesheet" href="/plugin-core/native-agent.css">
    <link rel="stylesheet" href="/ui_plugins/codex/styles.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="icon-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
      <symbol id="icon-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/></symbol>
      <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11a8 8 0 0 1-8 8H6l-4 3V11a9 9 0 0 1 19 0Z"/><path d="M7 10h10M7 14h6"/></symbol>
    </svg>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="/assets/launcher-icon.png" alt="" aria-hidden="true">
          <div>
            <strong>FastLLM</strong>
            <small>LAUNCHER</small>
          </div>
        </div>

        <nav class="navigation" aria-label="主导航">
          <p class="sidebar-heading" role="heading" aria-level="2">模型管理</p>
          <button class="nav-button active" type="button" data-view-button="launch" aria-current="page">
            <svg class="icon" aria-hidden="true"><use href="#icon-grid"/></svg>
            <span><strong>启动服务</strong></span>
          </button>
          <button class="nav-button" type="button" data-view-button="download">
            <svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg>
            <span><strong>下载模型</strong></span>
            <i id="download-activity" class="activity-dot"></i>
          </button>
          <button class="nav-button" type="button" data-view-button="logs">
            <svg class="icon" aria-hidden="true"><use href="#icon-terminal"/></svg>
            <span><strong>运行日志</strong></span>
          </button>
          <button class="nav-button" type="button" data-view-button="hardware">
            <svg class="icon" aria-hidden="true"><use href="#icon-cpu"/></svg>
            <span><strong>硬件信息</strong></span>
          </button>
          <div class="sidebar-heading agent-heading"><span role="heading" aria-level="2">agent</span><button type="button" data-manage-agent="harness" aria-label="管理 agent">管理</button></div>
          <button class="nav-button" type="button" data-view-button="webui">
            <svg class="icon" aria-hidden="true"><use href="#icon-chat"/></svg>
            <span><strong>工作室</strong></span>
          </button>
          <button class="nav-button" type="button" data-view-button="harness">
            <svg class="icon" aria-hidden="true"><use href="#icon-terminal"/></svg>
            <span><strong>DeepSeek Harness</strong></span>
          </button>
          <button class="nav-button" type="button" data-view-button="opencode">
            <svg class="icon" aria-hidden="true"><use href="#icon-terminal"/></svg>
            <span><strong>OpenCode</strong></span>
          </button>
          <button class="nav-button" type="button" data-view-button="codex">
            <svg class="icon" aria-hidden="true"><use href="#icon-terminal"/></svg>
            <span><strong>Codex</strong></span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-tip">
            <svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg>
            <strong>从一个模型开始</strong>
            <p>下载模型，选择配置，让本地算力开始工作。</p>
            <button type="button" data-open-view="download">浏览模型<svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></button>
          </div>
          <label class="language-picker theme-picker" for="theme-select">
            <span>界面主题</span>
            <select id="theme-select" aria-label="界面主题">
              <option value="light">浅色模式</option>
              <option value="dark">黑夜模式</option>
            </select>
          </label>
          <label class="language-picker" for="language-select">
            <span>界面语言</span>
            <select id="language-select" aria-label="界面语言">
              <option value="zh-CN">简体中文</option>
              <option value="en-US">English</option>
            </select>
          </label>
          <div class="footer-row">
            <span id="app-version" class="version">ftllm</span>
            <button id="shutdown-launcher" class="quiet-button" type="button">退出</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="workspace-breadcrumb"><span class="management-label">模型管理</span><span aria-hidden="true">/</span><strong id="current-view-title">启动服务</strong></div>
          <div class="service-controls">
          <div class="service-status">
          <div class="topbar-status">
            <span id="status-dot" class="status-dot stopped"></span>
            <div>
              <strong id="status-title">服务未启动</strong>
              <small id="status-message">选择启动项目后即可启动服务</small>
            </div>
          </div>
          <dl id="inference-status-bar" class="inference-status-bar hidden" aria-label="推理状态">
            <div class="inference-metric" title="并发时显示总速度，3 秒无新采样时归零。">
              <dt>Prefill</dt>
              <dd><strong id="prefill-speed">0</strong><span>tps</span></dd>
            </div>
            <div class="inference-metric" title="并发时显示总速度，3 秒无新采样时归零。">
              <dt>Decode</dt>
              <dd><strong id="decode-speed">0</strong><span>tps</span></dd>
            </div>
            <div id="context-window-metric" class="inference-metric">
              <dt>上下文</dt>
              <dd><strong id="context-window">—</strong></dd>
            </div>
          </dl>
          </div>
          <div class="topbar-actions">
            <button id="open-webui" class="primary-button" type="button" data-open-view="webui" disabled>打开工作室</button>
            <button id="open-endpoint" class="secondary-button" type="button" disabled>打开服务</button>
            <button id="stop-runtime" class="secondary-button danger hidden" type="button">■ 停止</button>
          </div>
          </div>
        </header>

        <div class="page-scroll">
          <!-- plugin:models -->

          <!-- plugin:studio -->

          <!-- plugin:harness -->

          <!-- plugin:opencode -->

          <!-- plugin:codex -->

          <!-- plugin:downloads -->

          <!-- plugin:logs -->

          <!-- plugin:hardware -->
        </div>
      </main>
    </div>

    <dialog id="automatic-config-dialog" class="automatic-config-dialog" aria-labelledby="automatic-config-dialog-title" aria-describedby="automatic-config-dialog-description">
      <div class="automatic-config-dialog-heading">
        <div><h2 id="automatic-config-dialog-title">自动配置</h2><p id="automatic-config-dialog-description">选择配置模式，确认后应用到当前启动项。</p></div>
        <button id="automatic-config-dialog-close" class="small-button" type="button" aria-label="关闭窗口">×</button>
      </div>
      <div id="automatic-mode-options" class="configuration-mode-options automatic-mode-options" role="radiogroup" aria-label="配置模式"></div>
      <p id="automatic-mode-description" class="configuration-mode-description"></p>
      <label class="speculative-auto-option">
        <input type="checkbox" id="automatic-enable-speculative-decoding" aria-describedby="automatic-speculative-description">
        <span><strong>自动配置时尝试启用内置 MTP</strong><small id="automatic-speculative-description">这是自动配置偏好；是否实际开启，以生成的推测解码参数为准。</small></span>
      </label>
      <p id="automatic-config-dialog-error" class="automatic-config-dialog-error hidden" role="alert"></p>
      <div class="automatic-config-dialog-actions">
        <button id="automatic-config-dialog-cancel" class="secondary-button" type="button">取消</button>
        <button id="automatic-config-dialog-apply" class="primary-button" type="button">应用配置</button>
      </div>
    </dialog>

    <div id="folder-picker-modal" class="folder-picker-modal hidden" role="dialog" aria-modal="true" aria-labelledby="folder-picker-title" aria-describedby="folder-picker-description">
      <section class="folder-picker-window">
        <header class="folder-picker-heading">
          <div>
            <span class="folder-picker-kicker">MODEL LOCATION</span>
            <h2 id="folder-picker-title" tabindex="-1">选择模型文件或文件夹</h2>
            <p id="folder-picker-description">浏览运行 Launcher 的机器。点击文件夹进入，选择文件或当前文件夹后确认。</p>
          </div>
          <button id="folder-picker-close" class="folder-picker-close" type="button" aria-label="关闭文件选择器">×</button>
        </header>
        <form id="folder-picker-location" class="folder-picker-location">
          <label for="folder-picker-current">文件夹路径</label>
          <div class="folder-picker-path">
            <input id="folder-picker-current" type="text" placeholder="输入文件夹或文件路径" spellcheck="false" autocomplete="off">
            <button class="folder-picker-up" type="submit">前往</button>
          </div>
        </form>
        <div class="folder-picker-toolbar">
          <button id="folder-picker-up" class="folder-picker-up" type="button">↑ 上一级</button>
          <label id="folder-picker-drive-field" class="folder-picker-drive-field hidden" for="folder-picker-drive">
            <span>磁盘</span>
            <select id="folder-picker-drive"></select>
          </label>
        </div>
        <div id="folder-picker-list" class="folder-picker-list" role="group" aria-label="文件和文件夹"></div>
        <div id="folder-picker-status" class="folder-picker-status" role="status" aria-live="polite"></div>
        <footer class="folder-picker-actions">
          <button id="folder-picker-cancel" class="secondary-button" type="button">取消</button>
          <button id="folder-picker-select" class="primary-button" type="button">选择此文件夹</button>
        </footer>
      </section>
    </div>

    <div id="confirmation-modal" class="confirmation-modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
      <section class="confirmation-window">
        <div class="confirmation-content">
          <div id="confirmation-icon" class="confirmation-icon" aria-hidden="true">!</div>
          <div class="confirmation-copy">
            <span id="confirmation-kicker">CONFIRM ACTION</span>
            <h2 id="confirmation-title" tabindex="-1">确认操作</h2>
            <p id="confirmation-message">请确认是否继续。</p>
          </div>
        </div>
        <footer class="confirmation-actions">
          <button id="confirmation-cancel" class="secondary-button" type="button">取消</button>
          <button id="confirmation-confirm" class="confirmation-confirm-button" type="button">确认</button>
        </footer>
      </section>
    </div>

    <datalist id="path-suggestions"></datalist>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
  </body>
</html>
