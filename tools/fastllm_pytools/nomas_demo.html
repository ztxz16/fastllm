<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HY-Nomas · 交互世界 · fastllm</title>
<style>
:root { color-scheme: light; --ink: #1d2924; --muted: #5f6c64; --line: #d8dfd8; --green: #345c49; }
* { box-sizing: border-box; } [hidden] { display: none !important; }
body { margin: 0; background: #f4f6f2; color: var(--ink); font: 14px/1.5 "DM Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
main { max-width: 1260px; margin: auto; padding: clamp(16px,2.7vw,40px); }
header,.identity,.actions,.player-controls,.file-title { display: flex; align-items: center; gap: 9px; }
header { margin-bottom: clamp(14px,2vw,26px); justify-content: space-between; }
.identity { gap: 12px; }
.mark { position: relative; width: 42px; height: 42px; border-radius: 13px; background: #204739; }
.mark::before,.mark::after { content: ""; position: absolute; inset: 10px 13px 15px 9px; border: 2px solid #d4ecba; border-radius: 3px; transform: skewY(-10deg); }
.mark::after { inset: 15px 9px 10px 13px; background: #204739; }
h1,h2,p { margin: 0; }
h1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-size: clamp(23px,3vw,34px); letter-spacing: -.045em; line-height: 1.2; }
h1 span { font-size: 14px; color: var(--muted); font-weight: 550; letter-spacing: normal; }
h2,summary { font-size: 16px; font-weight: 650; }
a { color: var(--green); text-underline-offset: 3px; } #api-docs { font-size: 12px; }
.layout { display: grid; grid-template-columns: minmax(0,1fr) clamp(248px,29%,330px); gap: 16px; align-items: start; }
aside { grid-column: 2; grid-row: 1; display: grid; gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 17px; background: white; padding: clamp(14px,2vw,21px); min-width: 0; }
.viewer { grid-column: 1; grid-row: 1; padding: 0; overflow: hidden; }
summary { cursor: pointer; }
label { display: block; font-size: 13px; font-weight: 550; margin: 13px 0 5px; }
button,select,input,textarea { font: inherit; }
button,select,textarea,input[type=number] { border: 1px solid var(--line); border-radius: 8px; min-height: 36px; padding: 7px 10px; color: var(--ink); background: white; }
button { background: var(--green); border-color: var(--green); color: white; cursor: pointer; font-weight: 550; }
button:hover:enabled { filter: brightness(.92); }
button.secondary { color: var(--ink); border-color: var(--line); background: white; }
button[aria-pressed=true] { background: #cee9bf; color: #173926; }
button:disabled,input:disabled,select:disabled,textarea:disabled { opacity: .55; cursor: default; }
:focus-visible,.file-pick:focus-within { outline: 2px solid #51836b; outline-offset: 2px; }
select,textarea,input[type=number] { width: 100%; } textarea { resize: vertical; min-height: 72px; line-height: 1.6; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { flex-wrap: wrap; margin-top: 13px; }
#generate,#apply-scene { flex: 1; }
.subsection { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
.subsection summary { font-size: 13px; color: var(--muted); }
.file-title { justify-content: space-between; }
.file-pick { border: 1px dashed #a8baad; background: #f6f9f5; border-radius: 8px; color: #3e614e; min-height: 42px; display: grid; place-items: center; position: relative; margin: 0; padding: 6px 10px; text-align: center; cursor: pointer; overflow-wrap: anywhere; }
.file-pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: inherit; }
#remove-reference { border: 0; background: none; color: var(--green); font-size: 12px; min-height: 0; padding: 0; }
.hint,#frame-info,#control-info,#session-info { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.hint:not(:empty),#frame-info,#control-info:not(:empty) { margin-top: 7px; }
.stage { position: relative; display: grid; overflow: hidden; background: #12241d; }
#video { display: block; width: 100%; height: auto; max-height: clamp(245px,62vh,570px); object-fit: contain; }
#reference-preview,#placeholder { position: absolute; inset: 0; height: 100%; width: 100%; }
#reference-preview { object-fit: contain; background: #15201b; pointer-events: none; }
#placeholder { display: flex; align-items: flex-end; background: radial-gradient(ellipse at 55% 35%,#3b5b4a,#192d25 78%); color: #fff; }
#placeholder img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 44%; }
.poster-copy { position: relative; width: 100%; display: flex; align-items: end; justify-content: space-between; gap: 12px; padding: 56px clamp(16px,3vw,32px) 22px; background: linear-gradient(transparent,#111c18df); }
.poster-copy small { color: #e4eadf; font-size: 12px; }
.poster-copy strong { display: block; margin-top: 2px; font-size: clamp(21px,2.7vw,30px); line-height: 1.25; }
#use-sample { border: 1px solid #ffffff75; color: white; background: #213027cc; white-space: nowrap; }
.viewer-body { padding: 15px clamp(14px,2vw,21px); } #status { font-size: 13px; }
progress { width: 100%; height: 6px; accent-color: var(--green); margin: 10px 0 0; }
.player-controls { margin-top: 8px; } .player-controls input { min-width: 34px; flex: 1; accent-color: var(--green); } .player-controls select { width: auto; }
.pad-title { color: var(--muted); font-size: 12px; margin: 9px 0 6px; }
.check { display: inline-flex; align-items: center; gap: 5px; margin: 0; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --ink: #eaf2eb; --muted: #b4c2b7; --line: #39483e; --green: #39634d; }
  body { background: #151b17; } .card,button.secondary,select,textarea,input[type=number] { background: #242d27; }
  .file-pick { background: #2c3830; color: #d6e7d7; } a,#remove-reference { color: #b9dfc3; }
  button[aria-pressed=true] { background: #bed8b6; color: #173926; }
}
@media (max-width: 690px) {
  main { padding: 14px; } .layout { grid-template-columns: minmax(0,1fr); gap: 12px; }
  aside,.viewer { grid-column: 1; grid-row: auto; } .viewer { order: -1; }
  #video { max-height: 47vh; } .poster-copy { padding: 36px 14px 14px; }
}
.scene-bar,.scene-state,.composer,.scene-dock,#navigation,.step-pad,.look-pad { display: flex; align-items: center; gap: 8px; }
.scene-bar { padding: 8px 14px; min-height: 43px; }
.scene-bar button,.dock-tool summary { font-size: 13px; }
.scene-bar button { padding: 5px 10px; min-height: 32px; }
.scene-state { flex: 1; min-width: 0; flex-wrap: wrap; gap: 2px 10px; }
#ambient { display: none; }
#video { position: relative; }
.viewer-body:has(#command-panel[hidden]):has(#player[hidden]):has(#expanded[hidden]) { display: none; }
.composer { border: 1px solid var(--line); border-radius: 12px; padding: 5px; }
.composer select,.composer textarea { border: 0; background: transparent; color: inherit; }
.composer textarea { flex: 1; width: 0; min-width: 55px; min-height: 38px; height: 38px; resize: none; }
.composer #edit-frames { width: auto; flex: none; }
.composer #apply-scene { flex: 0 0 auto; }
.scene-dock { position: relative; flex-wrap: wrap; margin-top: 8px; }
#navigation { flex-wrap: wrap; }
.step-pad,.look-pad { gap: 3px; }
.step-pad button { min-width: 36px; font-size: 17px; padding: 4px; }
.input-guide { display: none; font-size: 12px; color: var(--muted); }
.exploring .input-guide { display: inline; }
.dock-tool summary { padding: 8px; }
.tool-sheet { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper,#fff); }
.tool-sheet .check { margin-top: 10px; } .tool-sheet .pad-title { margin-top: 0; }
.has-world .tool-sheet { position: absolute; z-index: 3; right: 0; bottom: calc(100% + 5px); width: min(100%,370px); max-height: 44vh; overflow: auto; box-shadow: 0 8px 25px #1113; }
#progress { position: absolute; z-index: 1; inset: auto 0 0; margin: 0; width: 100%; height: 4px; border: 0; }
#gesture-hint { position: absolute; z-index: 1; top: 12px; left: 50%; transform: translateX(-50%); border-radius: 18px; padding: 5px 14px; background: #11251de8; color: white; pointer-events: none; }
#control-info:empty { display: none; }
.layout.exploring {
  --ink: #ecf2ed; --muted: #b3c2b8; --line: #435249; --paper: #202e26; --green: #bbddaa;
  position: fixed; inset: 0; z-index: 5; display: block; color-scheme: dark; background: #0e1813; color: var(--ink);
}
body:has(.exploring) { overflow: hidden; }
.exploring.view-only .viewer { grid-template-rows: minmax(0,1fr); }
.exploring.view-only .scene-bar,.exploring.view-only .viewer-body,.exploring.view-only .stage::after { display: none; }
#show-tools { position: absolute; top: max(8px,env(safe-area-inset-top)); right: max(8px,env(safe-area-inset-right)); opacity: .8; }
#show-tools:hover,#show-tools:focus-visible { opacity: 1; }
body:has(.exploring) main > header,.exploring aside { display: none; }
.exploring .viewer { display: grid; grid-template-rows: auto minmax(0,1fr) auto; width: 100%; height: 100%; background: transparent; border: 0; border-radius: 0; }
.exploring .scene-bar { min-height: 42px; padding: 5px max(12px,env(safe-area-inset-right)) 5px max(12px,env(safe-area-inset-left)); }
.exploring .scene-state { justify-content: center; text-align: center; }
.exploring #session-info { color: #d8edcf; }
.exploring #status { color: var(--muted); }
.exploring .stage { min-height: 0; background: #0c130f; isolation: isolate; }
.exploring #ambient { display: block; position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; filter: blur(32px) brightness(.38) saturate(.75); pointer-events: none; }
.exploring #video { width: 100%; height: 100%; min-height: 0; max-height: none; object-fit: contain; touch-action: none; cursor: grab; }
.exploring #video:active { cursor: grabbing; }
.exploring .viewer-body { padding: 8px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); background: #101b15; max-height: 50dvh; }
.exploring .composer,.exploring .scene-dock,.exploring #control-info,.exploring #prompt-status,.exploring #expanded { max-width: 930px; margin-inline: auto; }
.exploring .composer { background: #24332a; }
.exploring button,.exploring summary { background: #25352b; border-color: #425146; color: #f0f6ed; }
.exploring :is(#apply-scene,#follow_prompt),.exploring button[aria-pressed=true] { background: #c3e5ad; border-color: transparent; color: #193020; }
.exploring .scene-dock { justify-content: space-between; }
.exploring .scene-dock summary { border-radius: 7px; }
.exploring .tool-sheet { background: #1c2921; }
.exploring #expanded { font-size: 12px; max-height: 16vh; overflow: auto; }
.exploring #prompt-status { max-height: 3em; overflow: auto; }
@media (prefers-color-scheme: dark) { .tool-sheet { background: #242d27; } }
@media (max-width: 690px) {
  .exploring .input-guide { display: none; }
  .exploring .stage:has(#gesture-hint[hidden])::after { content: "滑动画面转向"; position: absolute; bottom: 6px; right: 8px; pointer-events: none; color: white; background: #102018b8; border-radius: 6px; padding: 2px 6px; font-size: 11px; }
  .scene-bar { padding-inline: 8px; } .scene-bar #session-info { display: none; }
  .composer { gap: 3px; } .composer select { max-width: 88px; } .composer button { padding-inline: 8px; }
  .scene-dock,#navigation { gap: 4px; } .step-pad button { min-width: 34px; }
  .exploring .viewer-body { padding-inline: 7px; } .exploring .scene-dock { justify-content: flex-start; }
}
</style></head>
<body><main>
<header><div class="identity"><div class="mark" aria-hidden="true"></div><h1>HY-Nomas <span>交互场景</span></h1></div><a id="api-docs" href="docs" target="_blank" rel="noopener">API 文档 ↗</a></header>
<div class="layout" id="layout">

<section class="card viewer" id="viewer" aria-label="场景画面">
  <div class="scene-bar">
    <button id="leave-scene" type="button" hidden>‹ 场景设置</button>
    <div class="scene-state"><strong id="session-info"></strong><span id="status" role="status">等待创建场景</span></div>
    <button id="cancel" type="button" hidden>取消生成</button>
    <button id="enter-scene" type="button" hidden>进入场景 ↗</button>
    <button id="view-only" type="button" hidden>纯画面</button>
    <button id="screen-toggle" type="button" hidden>全屏</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="ambient" aria-hidden="true" hidden></canvas>
    <canvas id="video" width="512" height="384" tabindex="0" aria-label="场景画面。用 W A S D 移动，按方向键或拖动画面转向。"></canvas>
    <img id="reference-preview" hidden alt="所选起始参考图"><div id="placeholder">
      <img id="sample-image" src="nomas-cafe.webp" alt="">
      <div class="poster-copy"><div><small id="poster-label">示例参考图</small><strong id="poster-title">雨夜咖啡馆</strong></div>
        <button id="use-sample" type="button">使用此图</button></div>
    </div>
    <button id="show-tools" type="button" hidden>显示操作</button>
    <span id="gesture-hint" hidden></span>
    <progress id="progress" value="0" max="100" aria-label="生成进度" hidden></progress>
  </div>
  <div class="viewer-body">
    <section id="command-panel" aria-label="下一条场景指令" hidden>
      <div class="composer">
        <div id="edit-type-option" hidden><select id="edit-kind" aria-label="指令类型"><option value="environment">环境变化</option><option value="action">人物动作</option><option value="prompt">完整描述</option></select></div>
        <textarea id="instruction" rows="1" aria-label="下一条场景指令" placeholder="例如，让窗外的雨停下来"></textarea>
        <select id="edit-frames" aria-label="本条指令的生成帧数" title="本条指令的生成帧数" hidden>
          <option value="20">20 帧</option><option value="40">40 帧</option><option value="60">60 帧</option>
          <option value="80">80 帧</option><option value="100">100 帧</option><option value="120">120 帧</option>
        </select>
        <button id="apply-scene" type="button" disabled>发送指令</button>
      </div>
      <p id="prompt-status" class="hint" role="status"></p>
    </section>
    <div class="scene-dock">
      <div id="navigation" hidden>
        <div class="step-pad" role="group" aria-label="移动">
          <button id="left" type="button" aria-label="左移 A" title="左移 · A">←</button>
          <button id="forward" type="button" aria-label="前进 W" title="前进 · W">↑</button>
          <button id="backward" type="button" aria-label="后退 S" title="后退 · S">↓</button>
          <button id="right" type="button" aria-label="右移 D" title="右移 · D">→</button>
        </div>
        <span class="input-guide"><span>WASD 移动 · </span>拖动画面转向</span>
        <button id="continuous" type="button" class="secondary">连续探索</button>
        <details id="look-tools" class="dock-tool">
          <summary>操控</summary>
          <div class="tool-sheet">
            <p class="pad-title">视角 · 方向键</p>
            <div class="look-pad">
              <button id="look_left" class="secondary" type="button">左转</button><button id="look_up" class="secondary" type="button">抬头</button>
              <button id="look_down" class="secondary" type="button">低头</button><button id="look_right" class="secondary" type="button">右转</button>
            </div>
            <div class="actions"><button id="follow_prompt" type="button">按指令继续</button><button id="stay" class="secondary" type="button">原地观察</button></div>
            <label class="check"><input id="paced" type="checkbox" checked> 自适应播放速度</label>
          </div>
        </details>
      </div>
      <details id="player" class="dock-tool" hidden><summary>回放</summary>
        <div class="tool-sheet"><div class="player-controls"><button id="play" type="button" class="secondary">播放</button><input id="seek" type="range" aria-label="本段播放位置" min="0" max="0" step="1" value="0">
        <select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></div><p id="frame-info"></p></div>
      </details>
    </div>
    <p id="control-info" role="status"></p>
    <details class="subsection" id="expanded" hidden><summary>实际生成描述</summary><p id="expanded-text" class="hint" style="white-space:pre-wrap;overflow-wrap:anywhere"></p></details>
  </div>
</section>
<aside>
  <details class="card" id="setup" open><summary>场景设置</summary>
    <form id="form">
      <label for="mode">模式</label><select id="mode"><option value="world">交互世界</option><option value="video">独立短视频</option></select>
      <div id="image-option">
        <div class="file-title"><label for="reference-image">起始参考图（可选）</label><button id="remove-reference" type="button" hidden>移除图片</button></div>
        <label class="file-pick"><span id="reference-name">选择图片</span><input id="reference-image" type="file" aria-label="选择起始参考图" accept="image/png,image/jpeg,image/webp"></label>
      </div>
      <label for="prompt">起始场景描述</label><textarea id="prompt" rows="3" required>A quiet café at night. A waitress stands behind a wooden counter. A white mug rests between her hands. Rain falls outside the window.</textarea>
      <div id="enhance-option"><label><input id="enhance-prompt" type="checkbox" checked> 提示词增强（Nomas-PE）</label><small class="hint" id="enhancer-hint" hidden>请在启动器的 HY-Nomas 服务设置中配置提示词增强地址。</small></div>
      <div id="perspective-option" hidden><label for="perspective">观察方式</label><select id="perspective" disabled><option value="auto">根据描述选择</option><option value="first-person">第一人称</option><option value="second-person">正面近景</option><option value="third-person follow">跟随主体</option><option value="third-person observer">外部观察</option></select></div>
      <label for="size">画面尺寸</label><select id="size"><option>128 × 128</option><option>256 × 160</option><option>256 × 256</option><option>384 × 224</option><option>512 × 288</option><option selected>512 × 384</option><option>768 × 448</option><option>960 × 544</option><option>1280 × 704</option><option value="custom">自定义</option></select>
      <div id="custom-size" hidden>
        <div class="row"><label>宽度（像素）<input id="custom-width" type="number" min="64" max="1280" step="32" value="512"></label>
        <label>高度（像素）<input id="custom-height" type="number" min="64" max="1280" step="32" value="384"></label></div>
        <small class="hint">宽高分别为 64–1280 的 32 倍数，最多 901120 像素。</small>
      </div>
      <details class="subsection"><summary>生成参数</summary>
        <div class="row"><div><label for="seed">随机种子</label><input id="seed" type="number" min="0" max="4294967295" value="42" required></div>
        <div id="frame-option"><label for="frames">视频帧数</label><select id="frames"><option value="20">20 帧</option><option value="16">16 帧</option><option value="32">32 帧</option><option value="40">40 帧</option></select></div></div>
      </details>
      <div class="actions"><button type="submit" id="generate">创建场景</button><button id="reset" class="secondary" type="button" hidden>结束场景</button></div>
    </form>
  </details>
</aside>
</div></main>
<script>
const $=id=>document.getElementById(id);
const actions={forward:'前进',backward:'后退',left:'左移',right:'右移',look_left:'左转',look_right:'右转',look_up:'抬头',look_down:'低头',stay:'原地观察',follow_prompt:'按描述继续生成'};
let active=null,world=null,busy=false,images=[],timer=null,playing=false,currentFrame=0,fps=24,epoch=0,originFrame=0,loop=true;
let continuous=false,desiredAction="stay",pendingAction=null,adaptiveRate=1,promptUpdate=null,promptError='',activePromptRevision=0;
let enhancerAvailable=null,preferClip=false;
let clip=null,frameCount=0;
const sampleURL='nomas-cafe.webp';
let referenceURL=null;
let exploring=false,queuedStep=null,gesture=null;
function setViewOnly(enabled){
  $('layout').classList.toggle('view-only',enabled);
  $('show-tools').hidden=!enabled;
  if(enabled){dismissTools();$('video').focus({preventScroll:true});}
}
$('view-only').onclick=()=>setViewOnly(true);
$('show-tools').onclick=()=>{setViewOnly(false);$('view-only').focus();};
function setExploring(enabled) {
  exploring=Boolean(enabled&&world&&$('mode').value==='world');
  $('layout').classList.toggle('exploring',exploring);
  setViewOnly(false);
  $('view-only').hidden=!exploring;
  $('leave-scene').hidden=!exploring;
  $('screen-toggle').hidden=!exploring||!document.fullscreenEnabled;
  $('look-tools').open=false;
  clearGesture();
  if(!exploring){
    stopContinuous();
    if(document.fullscreenElement===$('layout'))document.exitFullscreen().catch(()=>{});
  }
  controls();
  (exploring?$('video'):world?$('enter-scene'):$('generate')).focus({preventScroll:true});
}
$('enter-scene').onclick=()=>setExploring(true);
$('leave-scene').onclick=()=>setExploring(false);
$('screen-toggle').onclick=async()=>{
  try {
    if(document.fullscreenElement)await document.exitFullscreen();
    else await $('layout').requestFullscreen();
  } catch { $('status').textContent='浏览器未允许全屏，可继续在当前画面操作。'; }
};
document.addEventListener('fullscreenchange',()=>{
  $('screen-toggle').textContent=document.fullscreenElement?'退出全屏':'全屏';
});
function dismissTools() {
  $('look-tools').open=false;
  if(world)$('player').open=false;
}
$('look-tools').ontoggle=()=>{if($('look-tools').open)$('player').open=false;};
$('player').ontoggle=()=>{if(world&&$('player').open)$('look-tools').open=false;};
function canBufferStep(){
  return exploring&&busy&&world?.segments>0&&active&&!continuous;
}
function requestStep(action){
  if(continuous){pendingAction=action;showControl();return;}
  if(canBufferStep()&&!promptUpdate){
    // Preserve an accepted text edit until it has had a turn of its own.
    if(queuedStep!=='follow_prompt')queuedStep=action;
    showControl();
    return;
  }
  return move(action);
}
function drainStep(){
  if(!exploring||busy||promptUpdate||!queuedStep||world?.status!=='ready')return;
  const next=queuedStep;
  queuedStep=null;
  move(next);
}
function clearGesture(){
  gesture=null;
  $('gesture-hint').hidden=true;

function lookDirection(event){

  finally{idle();}
};
$('mode').onchange=()=>{controls();if(!busy&&!frameCount)$('status').textContent=$('mode').value==='world'?'等待创建场景':'等待生成视频';};
$('enhance-prompt').onchange=controls;
$('cancel').onclick=async()=>{
  stopContinuous();
  if(active)try{await post('/v1/videos/'+encodeURIComponent(active)+'/cancel',{});$('status').textContent='正在取消…';}
  catch(error){$('status').textContent=error.message;}
};
async function restore() {
  const params=new URLSearchParams(location.search),savedWorld=params.get('world'),savedVideo=params.get('video');
  if(!savedWorld&&!savedVideo)return;
  busy=true;controls();
  try {
    if(savedWorld&&/^world_[a-f0-9]{32}$/.test(savedWorld)) {
      $('mode').value='world';world=await api('/v1/worlds/'+savedWorld);restoreWorldInputs();
      const video=world.status==='generating'?world.current_job:world.latest_video;
      if(video)await followJob(await api('/v1/videos/'+video));
    } else if(savedVideo&&/^video_[a-f0-9]{32}$/.test(savedVideo)) {
      const job=await api('/v1/videos/'+savedVideo);$('mode').value=job.world_id?'world':'video';
      if(job.world_id){world=await api('/v1/worlds/'+job.world_id);restoreWorldInputs();}
      await followJob(job);
    }
  } catch(error){$('status').textContent=error.message;}
  finally{idle();}
}
function restoreWorldInputs(){
  $('setup').open=false;setExploring(true);
  const initial=world.prompt_revision>1?world.initial_scene:world.prompt;
  if(typeof initial==='string')$('prompt').value=initial;
  if(world.edit_kind)$('edit-kind').value=world.edit_kind;
  $('edit-frames').value=String(world.text_frames??20);
  $('enhance-prompt').checked=Boolean(world.enhance_prompt);$('perspective').value=world.perspective||'auto';showEnhancement(world);
  const size=`${world.width} × ${world.height}`;
  $('size').value=size;
  if($('size').value!==size){
    $('size').value='custom';$('custom-width').value=world.width;$('custom-height').value=world.height;
  }
  $('seed').value=world.seed;
}
api('/health').then(health=>{
  preferClip=health.playback_formats?.includes('mp4')&&Boolean(document.createElement('video').canPlayType('video/mp4; codecs="avc1.4D4028"'));
  configureEnhancer(health.prompt_enhancer?.enabled);
}).catch(()=>configureEnhancer(false));
controls();restore();
</script></html>
