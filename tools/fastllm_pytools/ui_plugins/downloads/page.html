<section id="view-download" class="view">
  <header class="download-header">
    <h1>下载模型</h1>
    <span id="download-catalog-count"></span>
  </header>

  <section id="download-transfer" class="download-transfer" aria-labelledby="download-status-title" hidden>
    <div class="download-transfer-head">
      <h2 id="download-status-title" role="status" tabindex="-1"></h2>
      <strong id="download-progress-value"></strong>
    </div>
    <progress id="download-progress" class="progress-track" aria-label="模型总进度" max="100" value="0"></progress>
    <p id="download-status-message"></p>
    <div class="download-transfer-stats">
      <span><span>已下载</span> <strong id="download-bytes"></strong></span>
      <span><span>文件</span> <strong id="download-files"></strong></span>
    </div>
    <div class="download-transfer-footer">
      <code id="download-destination"></code>
      <button id="download-cancel" class="secondary-button danger hidden" type="button">取消下载</button>
      <button id="download-use-model" class="primary-button hidden" type="button">使用这个模型启动</button>
    </div>
  </section>

  <form id="download-form">
    <fieldset id="download-category" class="download-categories">
      <legend class="visually-hidden">模型类别</legend>
    </fieldset>

    <div class="download-layout">
      <div id="download-catalog" class="download-catalog">
        <section class="download-release">
          <label id="download-family-field" class="download-family">
            <span>模型</span>
            <select id="download-family"></select>
          </label>
          <fieldset id="download-versions">
            <legend>精度与版本</legend>
            <div id="download-options"></div>
            <p id="download-note"></p>
          </fieldset>
          <div class="form-grid" data-custom-download hidden>
            <label class="field"><span>ModelScope 模型 ID <b>*</b></span>
              <input data-download-field="modelId" type="text" placeholder="Qwen/Qwen3-0.6B" spellcheck="false">
            </label>
            <label class="field"><span>下载范围（可选）</span>
              <input data-download-field="include" type="text" placeholder="Q2_0/*,mmproj-*.gguf" spellcheck="false">
              <small>多个匹配规则用逗号分隔，留空下载整个仓库。</small>
            </label>
            <label class="field"><span>Revision</span>
              <input data-download-field="revision" type="text" placeholder="master" spellcheck="false">
            </label>
          </div>
        </section>
        <details id="download-source-panel" open>
          <summary><span>组件与下载来源</span><small id="download-source-count"></small></summary>
          <ul id="download-sources"></ul>
        </details>
      </div>

      <aside class="download-checkout" aria-labelledby="download-checkout-title">
        <div class="download-receipt">
          <h2 id="download-checkout-title" tabindex="-1">下载清单</h2>
          <strong id="download-selection"></strong>
          <div id="download-estimate"></div>
        </div>
        <div class="download-checkout-controls">
          <label class="field" for="download-target"><span>保存目录 <b>*</b></span></label>
          <div class="download-path">
            <input id="download-target" data-download-field="targetDir" data-path-input data-directories-only type="text" list="path-suggestions" spellcheck="false">
            <button id="download-browse" class="secondary-button" type="button">浏览</button>
          </div>
          <small id="download-cache-hint">已有权重校验后可复用。</small>
          <div id="download-validation" class="validation-messages" hidden></div>
          <div class="download-cart-action">
            <button id="download-review" type="button">
              <span id="download-review-label">查看下载清单</span><strong id="download-review-value"></strong>
            </button>
            <button id="download-start" class="primary-button" type="submit">
              <svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg><span>开始下载</span>
            </button>
          </div>
          <details class="download-advanced">
            <summary>高级下载设置</summary>
            <div class="form-grid">
              <label class="field"><span>并发下载数</span>
                <input data-download-field="maxWorkers" type="number" min="1" max="64" inputmode="numeric">
              </label>
              <label class="field"><span>ModelScope Access Token</span>
                <input data-download-field="token" type="password" autocomplete="off" placeholder="私有模型可选">
              </label>
              <small>同一保存位置可继续下载。组合模型需要空目录，公用组件缓存在同级 .ftllm-downloads 目录。</small>
            </div>
          </details>
          <details class="download-advanced">
            <summary>实际下载命令</summary>
            <pre id="download-command" dir="ltr">正在生成命令…</pre>
          </details>
        </div>
      </aside>
    </div>
  </form>
</section>
