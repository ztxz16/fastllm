<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duo · 音视频对话</title>
  <style>
    :root { color-scheme: light; --ink: #22212a; --muted: #686572; --line: #dfdde6; --purple: #6550b7; --paper: #f6f5f8; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 "DM Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    main { max-width: 1260px; margin: auto; padding: clamp(16px,2.7vw,40px); }
    header, .heading, .controls, .file-title { display: flex; align-items: center; gap: 10px; }
    header { justify-content: space-between; margin-bottom: clamp(14px,2vw,26px); }
    .identity { display: flex; align-items: center; gap: 12px; }
    .mark { display: flex; align-items: center; justify-content: center; gap: 3px; width: 42px; height: 42px; border-radius: 13px; background: #2e2445; }
    .mark i { width: 4px; height: 12px; border-radius: 4px; background: #dacbff; }
    .mark i:nth-child(2) { height: 24px; } .mark i:nth-child(3) { height: 17px; }
    h1,h2,p,figure { margin: 0; }
    h1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-size: clamp(23px,3vw,34px); line-height: 1.2; letter-spacing: -.045em; }
    h1 span { font-size: 14px; font-weight: 550; color: var(--muted); letter-spacing: normal; }
    h2 { font-size: 16px; font-weight: 650; }
    #status { font-size: 12px; padding: 5px 10px; border-radius: 7px; background: #ece8f5; color: #56447c; overflow-wrap: anywhere; max-width: 44%; }
    .workspace { display: grid; grid-template-columns: minmax(0,1fr) clamp(238px,26%,312px); gap: 16px; align-items: start; }
    .stage-card,.panel { min-width: 0; border-radius: 17px; border: 1px solid var(--line); background: white; }
    .stage-card { overflow: hidden; }
    .stage { position: relative; display: grid; place-items: center; isolation: isolate; overflow: hidden; aspect-ratio: 16/10; background: #191621; }
    .stage > video,.stage > canvas,.standby { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .standby { pointer-events: none; display: grid; background: radial-gradient(ellipse at 62% 45%,#3b294f,#211a30 61%,#191622); }
    #signal { width: 100%; height: 100%; }
    #stage-portrait { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #191621; }
    .stage-copy { position: absolute; inset: auto 0 0; color: white; padding: 36px clamp(16px,3vw,34px) 24px; background: linear-gradient(transparent,#181421c4); }
    .stage-copy strong { font-size: clamp(20px,2.8vw,31px); font-weight: 600; letter-spacing: -.02em; }
    .stage-copy p { color: #d4cbdc; margin-top: 2px; font-size: 13px; }
    .local-view { position: absolute; top: 12px; right: 12px; width: clamp(64px,18%,132px); overflow: hidden; border: 1px solid #ffffff65; border-radius: 9px; background: #201d28; }
    .local-view video { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
    .local-view summary { cursor: pointer; padding: 2px 6px; font-size: 11px; color: white; }
    .local-view:not([open]) { width: auto; }
    .controls { flex-wrap: wrap; padding: 14px; gap: 8px; }
    button,textarea,select { font: inherit; }
    button, .file-pick, select { min-height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; color: var(--ink); background: white; }
    button,.file-pick,select { cursor: pointer; } button:hover:enabled,.file-pick:hover { border-color: #aaa1bc; background-color: #f5f2f9; }
    button:disabled, fieldset:disabled .file-pick,select:disabled { opacity: .5; cursor: default; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, .file-pick:focus-within { outline: 2px solid var(--purple); outline-offset: 2px; }
    #record { display: inline-flex; align-items: center; gap: 8px; background: #57428e; color: white; border-color: transparent; }
    #record:hover:enabled { background: #463478; } #record::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #e5d3ff; }
    #record.recording::before { background: #ffb0a9; border-radius: 2px; }
    #stop { margin-inline-start: auto; } #stop:disabled { border-color: transparent; }
    .side { display: grid; gap: 14px; } .panel { padding: clamp(14px,2vw,21px); }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; } legend { padding: 0; font-size: 16px; font-weight: 650; }
    .label { display: block; margin: 15px 0 6px; font-weight: 550; font-size: 13px; }
    .file-pick { display: grid; position: relative; text-align: center; align-items: center; justify-content: center; min-height: 76px; border: 1px dashed #b9adc9; background: #f9f7fc; color: #5f4e78; }
    .file-pick strong { font-weight: 600; } .file-pick small { font-size: 11px; color: var(--muted); }
    .file-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: inherit; }
    #portrait { max-width: 100%; width: 110px; border-radius: 5px; }
    .file-title { justify-content: space-between; } #clear-portrait { min-height: 0; padding: 2px 0; border: 0; color: var(--purple); font-size: 12px; }
    textarea,select { width: 100%; } textarea { min-height: 88px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; line-height: 1.6; }
    textarea::placeholder { color: #77717d; } .hint { color: var(--muted); font-size: 12px; margin-top: 9px; }
    .history { margin-top: 15px; } .heading { justify-content: space-between; } a { color: var(--purple); text-underline-offset: 3px; }
    #log { display: grid; gap: 9px; margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #log:empty::after { content: "对话开始后，这里会显示转写和回复。"; font-size: 13px; color: var(--muted); }
    #log div { border-inline-start: 3px solid #d8cbeb; padding-left: 10px; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --paper: #1a191d; --ink: #f1edf5; --muted: #b8b2c2; --line: #433f49; --purple: #cbbaf8; }
      .stage-card,.panel,button,textarea,select { background: #27252b; color: var(--ink); }
      #status,.file-pick { background: #342e40; color: #ddcff3; }
      button:hover:enabled,.file-pick:hover { background-color: #38323f; }
      textarea::placeholder { color: #b6aebc; }
    }
    @media (max-width: 690px) {
      main { padding: 14px; } .workspace { grid-template-columns: minmax(0,1fr); gap: 12px; }
      .main-col,.side { display: contents; } .stage-card { order: 1; } .settings { order: 2; } .history { order: 3; margin: 0; }
      .stage { aspect-ratio: 16/10; } .stage-copy { padding: 16px; } #stop { margin-inline-start: 0; }
    }
  </style>
</head>
<body><main>
  <header>
    <div class="identity"><div class="mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>Duo <span>音视频对话</span></h1></div>
    <span id="status" role="status">准备就绪</span>
  </header>
  <div class="workspace">
    <div class="main-col">
      <section class="stage-card" aria-label="音视频对话">
        <div class="stage">
          <video id="reply" playsinline controls></video><canvas id="livePicture" hidden></canvas>
          <div class="standby" id="standby">
            <canvas id="signal" width="1024" height="640" aria-hidden="true"></canvas>
            <img id="stage-portrait" hidden alt="角色参考图">
            <div class="stage-copy"><strong id="stage-title">等待对话</strong><p id="stage-hint">录制或上传一段有声视频，最长 30 秒。</p></div>
          </div>
          <details class="local-view" id="local-view" hidden open><summary>我的画面</summary><video id="preview" muted playsinline autoplay></video></details>
        </div>
        <div class="controls">
          <button id="record">开始录制</button><button id="upload">上传视频</button><input id="file" hidden type="file" accept="video/*">
          <button id="stop" disabled>结束会话</button>
        </div>
      </section>
      <section class="panel history">
        <div class="heading"><h2>对话记录</h2><a hidden id="download" download="duo-reply.mp4">下载完整回复</a></div>
        <div id="log" aria-live="polite"></div>
      </section>
    </div>
    <aside class="side"><div class="panel settings">
      <fieldset id="role"><legend>助手角色</legend>
        <div class="file-title"><span class="label">初始图片</span><button id="clear-portrait" type="button" hidden>移除图片</button></div>
        <label class="file-pick"><input id="role-image" type="file" aria-label="选择角色初始图片" accept="image/png,image/jpeg,image/webp">
          <span id="pick-copy"><strong>选择图片</strong><br><small>PNG · JPEG · WebP</small></span>
          <canvas id="portrait" aria-label="初始图片裁切预览" hidden></canvas>
        </label>
        <label class="label" for="description">角色和场景说明</label>
        <textarea id="description" rows="3" maxlength="512" placeholder="例如，桂言叶站在雨夜咖啡馆的吧台后，手边放着一个白杯。"></textarea>
        <p class="hint" id="role-hint" role="status">两项都可选。留空的项目沿用启动预设。</p>
      </fieldset>
      <label class="label" for="resolution">回复分辨率</label><select id="resolution"><option value="">服务默认</option></select>
    </div></aside>
  </div>
</main>
  <script src="avc-player.js"></script>
  <script>
    let avcPlayer, audioClock;
    const el = (id) => document.getElementById(id);
    let session = null,
      epoch = 0,
      recorder,
      stream,
      recordTimer,
      busy = false,
      queue = [],
      playing = false,
      inputURL,
      assistantLine,
      portraitRGB = null,
      readingPortrait = false,
      portraitError = "",
      portraitVersion = 0;
    // Static standby artwork. The player replaces it when the first reply frame arrives.
    function drawStandby() {
      const canvas = el("signal");
      const ctx = canvas.getContext("2d"), width = canvas.width, height = canvas.height;
      const ink = ctx.createLinearGradient(0, 0, width, height * .2);
      ink.addColorStop(0, "#9978da");
      ink.addColorStop(.38, "#bd90e2");
      ink.addColorStop(.67, "#e2b8f7");
      ink.addColorStop(1, "#978cf5");
      ctx.strokeStyle = ink;
      for (let line = 0; line < 56; line++) {
        const layer = line / 55;
        ctx.globalAlpha = .23 + .43 * Math.sin(layer * Math.PI);
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        for (let x = 0; x <= width; x += 3) {
          const t = x / width, bend = Math.sin(2 * Math.PI * (t - .14));
          const y = height * (.43 + .16 * bend + .10 * Math.sin(t * 9 + 1.4 + layer * 2.9)
                    + (layer - .5) * (.14 + .17 * Math.cos(t * 12)));
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    drawStandby();
    function status(text) {
      el("status").textContent = text;
    }
    function controls() {
      const locked = !!session || busy || !!recorder;
      el("resolution").disabled = locked;
      el("role").disabled = locked;
      el("record").classList.toggle("recording", !!recorder);
      el("local-view").hidden = !inputURL && !stream;
      el("pick-copy").hidden = !!portraitRGB;
      el("stage-portrait").hidden = !portraitRGB;
      el("stage-title").textContent = recorder ? "正在录制" : busy ? "等待助手回复" : portraitRGB ? "角色参考图" : "等待对话";
      el("stage-hint").textContent = recorder ? "点击发送录制，开始这一轮对话。" : busy ? "" : "录制或上传一段有声视频，最长 30 秒。";
      el("role-hint").textContent = portraitError || (readingPortrait ? "正在读取图片…" :
        session ? "当前会话沿用此角色。结束会话后可更换。" : "两项都可选。留空的项目沿用启动预设。");
      el("record").disabled = busy || readingPortrait || !!portraitError;
      el("upload").disabled = busy || !!recorder || readingPortrait || !!portraitError;
      el("stop").disabled = !session && !busy && !recorder;
    }
    async function preparePortrait() {
      const version = ++portraitVersion;
      const file = el("role-image").files[0], canvas = el("portrait");
      portraitRGB = null;
      portraitError = "";
      readingPortrait = !!file;
      canvas.hidden = true;
      el("clear-portrait").hidden = !file;
      controls();
      if (!file) return;
      const url = URL.createObjectURL(file);
      try {
        const photo = new Image();
        photo.src = url;
        await photo.decode();
        if (version !== portraitVersion) return;
        const [width, height] = (el("resolution").value || "512x384").split("x").map(Number);
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, width, height);
        const scale = Math.max(width / photo.naturalWidth, height / photo.naturalHeight);
        const w = photo.naturalWidth * scale, h = photo.naturalHeight * scale;
        ctx.drawImage(photo, (width-w)/2, (height-h)/2, w, h);
        const rgba = ctx.getImageData(0, 0, width, height).data;
        const rgb = new Uint8Array(width * height * 3);
        for (let src = 0, dst = 0; src < rgba.length; src += 4) {
          rgb[dst++] = rgba[src]; rgb[dst++] = rgba[src+1]; rgb[dst++] = rgba[src+2];
        }
        portraitRGB = new Blob([rgb], {type: "application/octet-stream"});
        el("stage-portrait").src = canvas.toDataURL("image/jpeg", .9);
        canvas.hidden = false;
      } catch {
        if (version === portraitVersion) portraitError = "图片读取失败，请重新选择或移除图片。";
      } finally {
        URL.revokeObjectURL(url);
        if (version === portraitVersion) { readingPortrait = false; controls(); }
      }
    }
    el("role-image").onchange = el("resolution").onchange = preparePortrait;
    el("clear-portrait").onclick = () => { el("role-image").value = ""; preparePortrait(); };
    function note(text) {
      const line = document.createElement("div");
      line.textContent = text;
      el("log").append(line);
      return line;
    }
    async function api(path, options) {
      const res = await fetch("." + path, options);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw Error(err.detail || res.statusText);
      }
      return res.json();
    }
    api("/resolutions").then(sizes => {
      el("resolution").replaceChildren(...sizes.map(size => new Option(size.replace("x", " × "), size)));
    }).catch(e => status(e.message));
    function showReply() { el("standby").hidden = true; }
    el("reply").onloadeddata = showReply;
    function clearPlayer() {
      el("standby").hidden = false;
      avcPlayer?.close();
      avcPlayer = null;
      el("livePicture").hidden = true;
      el("reply").hidden = false;
      queue = [];
      playing = false;
      el("reply").pause();
      el("reply").removeAttribute("src");
      el("reply").load();
    }
    function next() {
      if (!queue.length) {
        playing = false;
        return;
      }
      playing = true;
      el("reply").src = queue.shift();
      el("reply")
        .play()
        .catch(() => status("请点击播放"));
    }
    el("reply").onended = next;
    function releaseCamera() {
      clearTimeout(recordTimer);
      stream?.getTracks().forEach((t) => t.stop());
      stream = null;
      el("preview").srcObject = null;
    }
    async function end() {
      const old = session;
      ++epoch;
      session = null;
      busy = false;
      if (recorder) {
        recorder.onstop = null;
        if (recorder.state !== "inactive") recorder.stop();
        recorder = null;
      }
      releaseCamera();
      el("record").textContent = "开始录制";
      if (inputURL) URL.revokeObjectURL(inputURL);
      inputURL = null;
      el("preview").removeAttribute("src");
      el("preview").load();
      clearPlayer();
      controls();
      if (old) await api("/sessions/" + old, { method: "DELETE" });
      status("会话已结束");
    }
    el("stop").onclick = () => end().catch((e) => status(e.message));
    async function listen(id, version) {
      let cursor = 0;
      try {
        while (version === epoch) {
          const data = await api("/sessions/" + id + "/events?after=" + cursor);
          if (version !== epoch) return;
          cursor = data.cursor;
          for (const e of data.events) {
            if (e.type === "stage") status(e.name);
            if (e.type === "transcript") note("我　" + e.text);
            if (e.type === "plan" && e.action === "speak") {
              if (!assistantLine) assistantLine = note("助手　");
              assistantLine.append(document.createTextNode(e.text.replace(/<[^>]*>/g, "")));
            }
            if (e.type === "chunk") {
              if (e.url.endsWith(".mp4")) {
                queue.push("." + e.url);
                if (!playing) next();
              }
            }
            if (e.type === "done") {
              busy = false;
              status("回复已生成");
              el("download").href = "." + e.url;
              el("download").hidden = false;
              controls();
            }
            if (e.type === "input_error") {
              busy = false;
              status(e.text);
              controls();
            }
            if (e.type === "error") {
              status(e.text);
              note(e.text);
              busy = false;
              session = null;
              controls();
            }
          }
          if (data.closed) {
            if (session) status("会话已结束");
            session = null;
            busy = false;
            controls();
            return;
          }
        }
      } catch (e) {
        if (version === epoch) {
          status(e.message);
          busy = false;
          controls();
        }
      }
    }
    async function send(blob) {
      if (!blob || !blob.size) return;
      busy = true;
      controls();
      el("download").hidden = true;
      assistantLine = null;
      clearPlayer();
      const version = epoch;
      try {
        if (!session) {
          const resolution = encodeURIComponent(el("resolution").value);
          if (await DuoAvcPlayer.supported()) {
            audioClock ??= new AudioContext();
            await audioClock.resume();
          }
          const description = el("description").value.trim();
          let route = "/sessions", body;
          if (portraitRGB || description) {
            route = "/sessions/custom";
            body = new FormData();
            if (portraitRGB) body.append("reference_rgb", portraitRGB, "reference.rgb");
            if (description) body.append("description", description);
          }
          const created = await api(route + "?resolution=" + resolution + (audioClock ? "&playback=avc" : ""), {method: "POST", body});
          if (version !== epoch) {
            await api("/sessions/" + created.id, { method: "DELETE" });
            return;
          }
          session = created.id;
          listen(session, version);
        }
        status("上传视频");
        const accepted = await api("/sessions/" + session + "/turns", {
          method: "POST",
          body: blob,
        });
        if (version !== epoch) return;
        if (audioClock) {
          el("reply").hidden = true;
          el("livePicture").hidden = false;
          const active = avcPlayer = new DuoAvcPlayer(el("livePicture"), audioClock, undefined, showReply);
          active.play("." + accepted.stream).catch(error => {
            if (active === avcPlayer && error.name !== "AbortError") {
              active.close(); status(error.message);
            }
          });
        }
        status("正在处理输入");
      } catch (e) {
        if (version === epoch) {
          busy = false;
          status(e.message);
          controls();
        }
      }
    }
    function preview(blob) {
      if (inputURL) URL.revokeObjectURL(inputURL);
      inputURL = URL.createObjectURL(blob);
      el("preview").src = inputURL;
    }
    el("file").onchange = (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (file) {
        preview(file);
        send(file);
      }
    };
    el("upload").onclick = () => el("file").click();
    el("record").onclick = async () => {
      if (recorder) {
        clearTimeout(recordTimer);
        if (recorder.state !== "inactive") recorder.stop();
        return;
      }
      try {
        const version = epoch;
        busy = true;
        controls();
        const devices = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true,
        });
        if (version !== epoch) {
          devices.getTracks().forEach((t) => t.stop());
          return;
        }
        stream = devices;
        el("preview").srcObject = stream;
        recorder = new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data.size) chunks.push(e.data);
        };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: recorder.mimeType });
          recorder = null;
          releaseCamera();
          el("record").textContent = "开始录制";
          preview(blob);
          send(blob);
        };
        recorder.start();
        busy = false;
        el("record").textContent = "发送录制";
        status("录制中");
        controls();
        recordTimer = setTimeout(() => recorder?.stop(), 30000);
      } catch (e) {
        releaseCamera();
        busy = false;
        status(e.message);
        controls();
      }
    };
    window.addEventListener("pagehide", () => {
      if (session)
        fetch("./sessions/" + session, { method: "DELETE", keepalive: true });
      releaseCamera();
    });
  </script>
</body></html>
