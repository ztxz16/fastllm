<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMax-H3 · FastLLM</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#10151c;color:#e6eaf0}*{box-sizing:border-box}body{max-width:1160px;margin:auto;padding:40px 24px}h1{font-size:30px;margin:0}p{color:#aebac9;margin:8px 0 24px}.grid{display:grid;grid-template-columns:380px 1fr;gap:30px}form,.result{background:#19212b;border:1px solid #303d4d;border-radius:16px;padding:24px}label{display:block;margin-bottom:16px;font-size:14px}textarea,input,select,button{font:inherit;color:inherit;border-radius:8px;border:1px solid #405168;background:#111923;padding:10px;width:100%}textarea{resize:vertical;min-height:150px}input,select{margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{cursor:pointer;background:#3478c6;border:0;font-weight:600}button:disabled{opacity:.45;cursor:default}#cancel{background:#344253;margin-top:10px}video{display:block;width:100%;background:#0b1016;border-radius:8px;min-height:260px}progress{width:100%;accent-color:#59a6ff;margin:20px 0 5px}#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}a{color:#85beff}small{display:block;color:#98a8bb}[hidden]{display:none!important}.ref{display:flex;align-items:center;gap:6px;margin:8px 0;font-size:13px}.ref span{flex:1;overflow-wrap:anywhere}.ref button{width:30px;padding:4px;background:#344253}.result{display:flex;flex-direction:column;justify-content:center}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#0c131b;padding:16px;border-radius:8px}details{margin-top:20px}#download{display:none;margin-top:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:24px 16px}}
</style>
<h1>MiniMax-H3</h1><p>输入一段描述，生成带立体声音轨的视频。由 FastLLM 在本地运行。</p>
<div class="grid">
<form id="form">
<label>生成方式<select id="mode"><option value="text">文字生成</option><option value="first">首帧生成</option><option value="last">尾帧生成</option><option value="both">首尾帧生成</option><option value="reference">参考素材生成</option></select></label>
<label id="firstLabel" hidden>首帧<input id="firstFrame" type="file" accept="image/png,image/jpeg"></label>
<label id="lastLabel" hidden>尾帧<input id="lastFrame" type="file" accept="image/png,image/jpeg"></label>
<div id="referencePanel" hidden><label>添加参考素材<input id="references" type="file" multiple accept="image/png,image/jpeg,video/mp4,video/webm,audio/wav,audio/mpeg,audio/flac,audio/ogg"></label><div id="referenceList"></div><small>素材按下方顺序送入模型，可在提示词中使用 Picture 1、Video 1、Audio 1。最多 9 张图、3 段视频、3 段音频，共 12 份；视频和音频各不超过 15 秒，音频须搭配图片或视频。</small></div>
<label>提示词<textarea id="prompt" required>A small orange cat plays a piano on a warmly lit stage. The camera slowly moves closer. Soft piano music fills the room.</textarea></label>
<div class="row"><label>尺寸<select id="size"><option>768x448</option><option>512x512</option><option>448x768</option><option>1344x768</option></select></label><label>时长<select id="seconds"><option value="5">约 5 秒 · 124 帧</option><option value="8">约 8 秒 · 192 帧</option><option value="12">约 12 秒 · 294 帧</option></select></label></div>
<div class="row"><label>采样网格点数<input id="steps" type="number" value="50" min="2" max="100" required></label><label>种子<input id="seed" type="number" value="42" min="0" max="2147483647" required></label></div>
<label>API Key（服务启用鉴权时填写）<input id="key" type="password" autocomplete="off"></label>
<button id="submit">生成视频</button><button type="button" id="cancel" disabled>取消任务</button>
<small>视频为 24 fps。时长会向上对齐到模型支持的帧数；首次运行需要加载权重。</small>
</form>
<div class="result"><video id="video" controls playsinline></video><progress id="progress" max="100" value="0"></progress><div id="status">等待提交</div><a id="download" download="minimax-h3.mp4">下载视频</a></div>
</div>
<details><summary>HTTP 调用示例</summary><pre id="curl"></pre><small>提交后查询 GET /v1/videos/{id}，完成后下载 GET /v1/videos/{id}/content。<a href="/openapi.json">OpenAPI 规范</a></small></details>
<script>
const $=id=>document.getElementById(id);let job=null,objectURL=null;
const headers=()=>({'Authorization':'Bearer '+$('key').value});
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...headers(),...options.headers}});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||r.statusText);return data}
function request(){return {model:'minimax-h3',prompt:$('prompt').value,size:$('size').value,seconds:$('seconds').value,num_inference_steps:Number($('steps').value),seed:Number($('seed').value)}}
let referenceFiles=[];
function uploads(){const mode=$('mode').value,files=[];
if(['first','both'].includes(mode)&&$('firstFrame').files[0])files.push(['input_reference',$('firstFrame').files[0]]);
if(['last','both'].includes(mode)&&$('lastFrame').files[0])files.push(['last_frame',$('lastFrame').files[0]]);
if(mode==='reference')for(const file of referenceFiles)files.push(['reference',file]);return files}
function modeChanged(){const m=$('mode').value;$('firstLabel').hidden=!['first','both'].includes(m);$('lastLabel').hidden=!['last','both'].includes(m);$('referencePanel').hidden=m!=='reference';$('firstFrame').required=!$('firstLabel').hidden;$('lastFrame').required=!$('lastLabel').hidden;curl()}
function showReferences(){const list=$('referenceList');list.replaceChildren();referenceFiles.forEach((file,i)=>{const row=document.createElement('div');row.className='ref';const name=document.createElement('span');name.textContent=`${i+1}. ${file.name}`;row.append(name);for(const [title,delta] of [['上移',-1],['下移',1],['移除',0]]){const b=document.createElement('button');b.type='button';b.textContent=delta<0?'↑':delta>0?'↓':'×';b.title=title;b.disabled=delta<0&&i===0||delta>0&&i===referenceFiles.length-1;b.onclick=()=>{if(delta)[referenceFiles[i],referenceFiles[i+delta]]=[referenceFiles[i+delta],referenceFiles[i]];else referenceFiles.splice(i,1);showReferences();curl()};row.append(b)}list.append(row)})}
$('references').onchange=()=>{referenceFiles.push(...$('references').files);$('references').value='';showReferences();curl()};
$('mode').onchange=modeChanged;
const quote=s=>"'"+String(s).replaceAll("'","'\\''")+"'";
function curl(){const lines=[`curl ${location.origin}/v1/videos`];if($('key').value)lines.push("-H 'Authorization: Bearer YOUR_API_KEY'");for(const [k,v] of Object.entries(request()))lines.push('--form-string '+quote(k+'='+v));for(const [k,file] of uploads())lines.push('-F '+quote(k+'=@'+file.name+';type='+file.type));$('curl').textContent=lines.join(' \\\n  ')}
$('form').addEventListener('input',curl);modeChanged();
fetch('/health').then(r=>r.json()).then(h=>{if(!h.conditioning){$('mode').value='text';$('mode').disabled=true;modeChanged()}else if(!h.reference_model_available)$('mode').querySelector('option[value="reference"]').disabled=true}).catch(()=>{});
$('form').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;$('download').style.display='none';$('progress').value=0;
try{if($('mode').value==='reference'&&!referenceFiles.length)throw new Error('请添加参考素材');const body=new FormData();for(const [k,v] of Object.entries(request()))body.append(k,String(v));for(const [k,file] of uploads())body.append(k,file);job=await api('/v1/videos',{method:'POST',body});$('cancel').disabled=false;
while(true){$('progress').value=job.progress;$('status').textContent=`${job.id}\n${job.status} · ${job.mode||'t2va'} · ${job.stage} ${job.current}/${job.total}\n${job.frames} 帧 · ${job.size}`;
if(job.status==='completed'){const response=await fetch(`/v1/videos/${job.id}/content`,{headers:headers()});if(!response.ok)throw new Error('视频下载失败');if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(await response.blob());$('video').src=objectURL;$('download').href=objectURL;$('download').style.display='inline';break}
if(['failed','cancelled'].includes(job.status))throw new Error(job.error?.message||job.status);
await new Promise(resolve=>setTimeout(resolve,2000));job=await api(`/v1/videos/${job.id}`)}
}catch(error){$('status').textContent=error.message}finally{$('submit').disabled=false;$('cancel').disabled=true;job=null}};
$('cancel').onclick=async()=>{if(job){try{await api(`/v1/videos/${job.id}/cancel`,{method:'POST'});$('cancel').disabled=true}catch(error){$('status').textContent=error.message}}};
</script>
</html>
