    <linearGradient id="tile" x1="16" y1="8" x2="110" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11a6a0"/><stop offset="1" stop-color="#086873"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <rect x="19" y="19" width="90" height="66" rx="8" fill="#123e4b" stroke="#edfffb" stroke-width="4"/>
  <path d="M21 34h86" fill="none" stroke="#edfffb" stroke-width="3"/>
  <g fill="#9cf5df"><circle cx="28" cy="27" r="2"/><circle cx="36" cy="27" r="2"/><circle cx="44" cy="27" r="2"/></g>
  <!-- Keep the same FastLLM mark as the desktop app, with a network badge. -->
  <g transform="translate(14 20) scale(.60)">
